name: Build AirSync Self-Compiled

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build AirSync Self-Compiled
      run: |
        xcodebuild -project AirSync.xcodeproj \
          -scheme "AirSync Self Compiled" \
          -configuration "Self Compiled" \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          clean build

    - name: Package Artifact
      run: |
        cd "./build/Build/Products/Self Compiled"
        ls -la
        zip -r -y "$GITHUB_WORKSPACE/AirSync-SelfCompiled.zip" AirSync.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-SelfCompiled
        path: AirSync-SelfCompiled.zip
